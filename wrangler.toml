name = "live-code"
main = "src/index.js"
compatibility_date = "2026-01-01"

# La página (carpeta public). Las rutas /api/* pasan primero por el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Base de datos D1. Al no llevar database_id, Cloudflare la crea sola
# en el primer despliegue y la deja conectada.
[[d1_databases]]
binding = "DB"
database_name = "live-code-db"
